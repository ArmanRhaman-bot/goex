<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#eef8f3">
  <title>Goex AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="loading" class="loading"><div class="spinner"></div><b>Loading…</b></div>

<div id="gate" class="screen gate hidden">
  <div class="gate-card">
    <div class="logo-circle">₮</div>
    <h1>Join our channel</h1>
    <p>You must join the official Telegram channel before using the app.</p>
    <a id="joinBtn" class="btn primary" target="_blank">Join channel</a>
    <button id="verifyJoin" class="btn soft">I joined — Check</button>
    <p id="gateMsg" class="muted small"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button class="icon-btn" id="closeBtn" aria-label="Close">×</button>
    <strong id="appName">Goex AI</strong>
    <div class="top-actions"><span id="onlinePill" class="online">● 28 online</span><button class="icon-btn" id="moreBtn">⋮</button></div>
  </header>

  <main id="content" class="content"></main>

  <nav class="bottom-nav">
    <button data-page="trade" class="nav-item"><span>◫</span><small>Trade</small></button>
    <button data-page="friends" class="nav-item"><span>♧</span><small>Friends</small></button>
    <button data-page="home" class="home-fab active"><span>⌂</span></button>
    <button data-page="gifts" class="nav-item"><span>♔</span><small>Gifts</small></button>
    <button data-page="account" class="nav-item"><span>♙</span><small>Account</small></button>
  </nav>
</div>

<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalBody"></div></div>
<script src="/app.js"></script>
</body>
</html>
